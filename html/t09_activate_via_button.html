<!DOCTYPE html>
<html lang="en">

<head>
  <title>T09-activate via button</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* BLUE START BUTTON */
    button {
      background-color: blue;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: darkblue;
    }

    #spaceForJavaScriptOutput {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid black;
    }
  </style>
</head>

<body>

  <h1>T09-activate via button</h1>

  <p>Open the console (Ctrl-Shift-I) to see the messages.</p>

  <!-- START BUTTON -->
  <button onclick="start()">START</button>

  <!-- OUTPUT AREA -->
  <div id="spaceForJavaScriptOutput">
    The output of your script will go here.
  </div>

  <!-- LINK TO JAVASCRIPT -->
 <script src="../js/t09_activate_via_button/t09_activate_via_button.js"></script>


</body>
</html>
